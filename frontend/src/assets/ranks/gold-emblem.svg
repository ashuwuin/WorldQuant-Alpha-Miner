<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldOuterRing" x1="10" y1="6" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9DB"/>
      <stop offset="25%" stop-color="#FACC15"/>
      <stop offset="52%" stop-color="#CA8A04"/>
      <stop offset="78%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="goldShieldBody" x1="24" y1="16" x2="96" y2="104" gradientUnits="userSpaceOnUse">
