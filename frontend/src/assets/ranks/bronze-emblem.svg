<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bronzeOuterRing" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7D4B2"/>
      <stop offset="28%" stop-color="#CD7F32"/>
      <stop offset="55%" stop-color="#8B4513"/>
      <stop offset="78%" stop-color="#E09553"/>
      <stop offset="100%" stop-color="#5C2D0C"/>
    </linearGradient>
    <linearGradient id="bronzeShieldBody" x1="26" y1="18" x2="94" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6A165"/>
      <stop offset="40%" stop-color="#B86828"/>
      <stop offset="72%" stop-color="#763A10"/>
      <stop offset="100%" stop-color="#4A2106"/>
    </linearGradient>
    <linearGradient id="bronzeInnerCore" x1="35" y1="28" x2="85" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B1B08"/>
      <stop offset="50%" stop-color="#221004"/>
      <stop offset="100%" stop-color="#52260B"/>
    </linearGradient>
    <linearGradient id="bronzeCrownSpecular" x1="40" y1="24" x2="80" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0DE"/>
      <stop offset="45%" stop-color="#E59852"/>
      <stop offset="100%" stop-color="#9A4E18"/>
    </linearGradient>
    <radialGradient id="bronzeGemGlow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#FFEAD2" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#CD7F32" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B1B08" stop-opacity="0"/>
    </radialGradient>
    <filter id="bronzeDropShadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A0B02" flood-opacity="0.48"/>
    </filter>
  </defs>

  <g filter="url(#bronzeDropShadow)">
    <!-- Outer Laurel & Octagonal Crest Base -->
    <polygon points="60,4 94,18 112,50 102,88 60,115 18,88 8,50 26,18" fill="url(#bronzeOuterRing)" stroke="#F9DEC2" stroke-width="1.5"/>
    <!-- Inner Bevel Facets -->
    <polygon points="60,10 89,22 105,51 96,84 60,108 24,84 15,51 31,22" fill="url(#bronzeShieldBody)" stroke="#5C2D0C" stroke-width="1.2"/>
    <!-- Faceted Ridge Lines -->
    <line x1="60" y1="4" x2="60" y2="16" stroke="#FCE5CE" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="60" y1="108" x2="60" y2="115" stroke="#FCE5CE" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="8" y1="50" x2="21" y2="52" stroke="#FCE5CE" stroke-width="1.1" stroke-opacity="0.5"/>
    <line x1="112" y1="50" x2="99" y2="52" stroke="#FCE5CE" stroke-width="1.1" stroke-opacity="0.5"/>

    <!-- Recessed Dark Bronze Medallion Core -->
    <polygon points="60,17 84,27 97,52 89,79 60,99 31,79 23,52 36,27" fill="url(#bronzeInnerCore)" stroke="url(#bronzeOuterRing)" stroke-width="1.8"/>
    <circle cx="60" cy="56" r="32" fill="url(#bronzeGemGlow)"/>

    <!-- Left & Right Metallic Laurel Branches -->
    <path d="M34 74 C27 63, 27 46, 36 34 C33 45, 34 59, 41 70 Z" fill="url(#bronzeCrownSpecular)" opacity="0.9"/>
    <path d="M86 74 C93 63, 93 46, 84 34 C87 45, 86 59, 79 70 Z" fill="url(#bronzeCrownSpecular)" opacity="0.9"/>

    <!-- Central 3D Faceted Alpha / Chevron Emblem -->
    <path d="M60 27 L78 65 L69 65 L60 45 L51 65 L42 65 Z" fill="url(#bronzeCrownSpecular)" stroke="#FFF3E6" stroke-width="0.9"/>
    <polygon points="60,49 67,65 53,65" fill="#8B4513"/>

    <!-- Single Tier Star -->
    <polygon points="60,69 62.6,74.4 68.5,75.2 64.2,79.3 65.3,85.2 60,82.4 54.7,85.2 55.8,79.3 51.5,75.2 57.4,74.4" fill="#FFE6CC" stroke="#9A4E18" stroke-width="0.8"/>

    <!-- Bottom Ribbon Banner -->
    <path d="M32 90 L88 90 L83 102 L60 107 L37 102 Z" fill="url(#bronzeOuterRing)" stroke="#FFF0DE" stroke-width="1"/>
    <text x="60" y="100" text-anchor="middle" fill="#2A1103" font-family="JetBrains Mono, monospace" font-weight="800" font-size="8.5" letter-spacing="1.2">BRONZE</text>
  </g>
</svg>
