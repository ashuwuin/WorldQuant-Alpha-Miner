<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Alpha Coordinate Not Found | Quantum Alpha Studio</title>
    <meta name="description" content="Quantum Alpha Studio - 404 Quant Coordinate Not Found.">
    <link rel="icon" href="/static/img/alpha_icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            background: rgba(42, 39, 37, 0.88);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(234, 226, 211, 0.12);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #AE8F60, #F6F2F1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="error-wrapper">
        <div class="error-card">
            <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
                <img src="/static/img/alpha_icon.svg" alt="ALPHA" style="width: 48px; height: 48px; filter: drop-shadow(0 0 10px rgba(174, 143, 96, 0.5));">
            </div>
            <div class="error-code">404</div>
            <h1 style="font-size: 1.35rem; font-weight: 700; color: var(--color-bright-white); margin-bottom: 0.75rem;">Quant Coordinate Undefined</h1>
            <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
                The requested URL does not correspond to an active factor registry, platform hurdle, or portfolio route.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="/dashboard" class="btn-hero-primary" style="padding: 0.75rem 1.75rem; text-decoration: none;">
                    Return to Dashboard
                </a>
                <a href="/studio" class="btn-hero-secondary" style="padding: 0.75rem 1.75rem; text-decoration: none;">
                    Open Studio
                </a>
            </div>
        </div>
    </div>

    <script src="/static/js/particles.js"></script>
</body>
</html>
