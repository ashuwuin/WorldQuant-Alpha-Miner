<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" fill="none">
  <defs>
    <!-- Brushed Metallic Platinum-Sand Sheen Gradient -->
    <linearGradient id="metalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#F6F2F1" />
      <stop offset="45%" stop-color="#EAE2D3" />
      <stop offset="70%" stop-color="#C5B6A1" />
      <stop offset="85%" stop-color="#AE8F60" />
      <stop offset="100%" stop-color="#8F7249" />
    </linearGradient>

    <!-- Subtle Specular Highlight -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F6F2F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2A2725" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Shadow & Glow Filter -->
    <filter id="alphaEmboss" x="-10%" y="-10%" width="120%" height="130%">
